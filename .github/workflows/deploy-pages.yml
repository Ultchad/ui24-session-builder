name: Deploy Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static Web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required Web assets
        run: |
          test -s applications/web/index.html
          test -s applications/web/app.js
          test -s applications/web/styles.css
          test -s applications/web/wasm/ui24_audio_processing.js
          test -s applications/web/wasm/ui24_audio_processing_bg.wasm
          grep -q 'app.js?v=' applications/web/index.html
          grep -q 'convert_audio_to_flac_bytes' applications/web/app.js
          grep -q 'convert_audio_to_mp3_bytes' applications/web/app.js
          grep -q 'Downmix mono' applications/web/app.js
          grep -q 'Split stereo' applications/web/app.js
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static Web application
        uses: actions/upload-pages-artifact@v3
        with:
          path: applications/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

