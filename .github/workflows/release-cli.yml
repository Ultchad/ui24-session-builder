name: Release CLI binaries

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            target: x86_64-unknown-linux-gnu
            binary: ui24-session-builder-linux-x86_64
            source: target/x86_64-unknown-linux-gnu/release/ui24-session-builder
          - name: Windows x86_64
            target: x86_64-pc-windows-gnu
            binary: ui24-session-builder-windows-x86_64.exe
            source: target/x86_64-pc-windows-gnu/release/ui24-session-builder.exe

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD "origin/main"

      - name: Install Windows linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-mingw-w64-x86-64

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --locked --release --package ui24-session-builder --target "${{ matrix.target }}"

      - name: Rename binary for release
        run: cp "${{ matrix.source }}" "${{ matrix.binary }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
